name: Deploy SPACE site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check application and public verification
        run: |
          node --check member-id.js
          node --check member-id-lanyard.js
          node scripts/check_member_id.mjs
          node scripts/check_lanyard_physics.mjs
          node --check card-swap.js
          node scripts/check_card_swap.mjs
          node --check space-bento.js
          node scripts/check_space_bento.mjs
          node --check member-wall.js
          node scripts/check_member_wall.mjs
          node --check app.js
          node --check club-guidance.js
          node scripts/check_club_guidance.mjs
          node --check mobile-workspace.js
          node scripts/check_mobile_workspace.mjs
          node --check space-avatars.js
          node --check space-globe.js
          node scripts/check_space_globe.mjs
          node --check space-map.js
          node scripts/check_space_map_avatars.mjs
          node --check shared-chat-glow.js
          node scripts/check_shared_chat_glow.mjs
          node --check chat-waves.js
          node scripts/check_chat_waves.mjs
          node --check club-certificates.js
          node scripts/check_course_certificates_ui.mjs
          node --check reset-password.js
          node scripts/check_password_recovery.mjs
          node --check club-commerce.js
          node scripts/check_commerce_ui.mjs
          node --check certificate.js
          node scripts/check_workspace.mjs
          node scripts/check_certificate_verification.mjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html reset-password.html reset-password.js club-certificates.js club-certificates.css certificate.html certificate.js styles.css public-pages.css club-commerce.css club-commerce.js app.js config.js sitemap.xml .nojekyll manifest.webmanifest sw.js offline.html pwa-register.js chat-waves.js chat-waves.css shared-chat-glow.js shared-chat-glow.css space-avatars.js space-globe.js space-map.js space-map-avatars.css mobile-workspace.js mobile-workspace.css club-guidance.js club-guidance.css member-wall.js member-wall.css space-bento.js space-bento.css card-swap.js card-swap.css member-id.js member-id.css member-id-lanyard.js _site/
          cp -R assets about founders icons vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
