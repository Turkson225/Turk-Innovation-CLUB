name: Deploy SPACE site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check application and public verification
        run: |
          node --check app.js
          node --check reset-password.js
          node scripts/check_password_recovery.mjs
          node --check club-commerce.js
          node scripts/check_commerce_ui.mjs
          node --check certificate.js
          node scripts/check_workspace.mjs
          node scripts/check_certificate_verification.mjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html reset-password.html reset-password.js certificate.html certificate.js styles.css public-pages.css club-commerce.css club-commerce.js app.js config.js sitemap.xml .nojekyll manifest.webmanifest sw.js offline.html pwa-register.js _site/
          cp -R assets about founders icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
