name: Check shop and role permissions
on:
  push:
    branches: [main]
    paths:
      - 'supabase/upgrade_club_shop.sql'
      - 'supabase/upgrade_shop_product_alerts.sql'
      - 'supabase/upgrade_shop_order_tracking.sql'
      - 'supabase/upgrade_order_desk_dm_reads.sql'
      - 'supabase/upgrade_role_acknowledgements.sql'
      - 'scripts/check_commerce_database.mjs'
      - 'club-commerce.js'
      - 'scripts/load_test_fixture.mjs'
      - '.github/workflows/shop-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated database test driver
        run: npm install --prefix "$RUNNER_TEMP/space-shop-check" --no-package-lock --ignore-scripts pg@8.16.3
      - name: Check permissions, reservations, collection and concurrent checkout
        env:
          SPACE_SHOP_DISPOSABLE: '1'
          SPACE_SHOP_TEST_DATABASE_URL: postgresql://postgres:synthetic-disposable-only@127.0.0.1:5432/postgres
        run: SPACE_PG_MODULE="$RUNNER_TEMP/space-shop-check/node_modules/pg" node scripts/check_commerce_database.mjs
