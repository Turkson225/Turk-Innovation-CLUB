name: Check private SPACE Map and avatars
on:
  push:
    branches: [main]
    paths:
      - 'supabase/upgrade_space_map_avatars.sql'
      - 'scripts/check_space_map_database.mjs'
      - '.github/workflows/map-avatars-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL engine
        run: npm install --prefix "$RUNNER_TEMP/map-avatar-check" --no-package-lock --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Verify owner-only wardrobes, private recipient locations, expiry and venue access
        run: SPACE_PGLITE_MODULE="$RUNNER_TEMP/map-avatar-check/node_modules/@electric-sql/pglite" node scripts/check_space_map_database.mjs
