<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111827">
  <title>Set your password · SPACE</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css?v=space-password-20261016">
  <style>
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;margin:0;padding:24px;background:radial-gradient(ellipse at 15% 10%,#ece6ff,transparent 55%),#f4f5fa}
    main{width:min(100%,480px);padding:clamp(24px,6vw,40px);background:#fff;border:1px solid #e6e7ef;border-radius:22px;box-shadow:0 18px 70px #21203c12}
    .reset-brand{display:block;width:156px;height:auto;margin-bottom:28px}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.2;margin:10px 0 14px;letter-spacing:-.04em}
    main>p{line-height:1.6}form{margin-top:24px!important}.back-link{display:inline-block;margin-top:24px;font-size:13px}.reset-status{line-height:1.6;font-size:14px;padding:14px;border-radius:10px;background:#f1edfc}.reset-status:empty{display:none}[hidden]{display:none!important}
    input{font-size:16px!important}button:disabled{opacity:.55;cursor:wait}
  </style>
</head>
<body>
  <main>
    <a href="./" aria-label="SPACE home"><img class="reset-brand" src="assets/space-wordmark.png" alt="SPACE" width="312" height="76"></a>
    <span class="eyebrow">Account access</span>
    <h1 id="resetTitle">Set your password</h1>
    <p id="resetIntro" class="muted">Open the link in your password reset email, or enter its verification code below.</p>
    <p id="resetStatus" class="reset-status" role="status" aria-live="polite">Checking your reset link…</p>
    <form id="recoveryCodeForm" class="form-stack" hidden>
      <div class="field"><label for="email">Account email</label><input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="recoveryCode">Reset code</label><input id="recoveryCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required></div>
      <button class="button" type="submit">Verify reset code</button>
    </form>
    <form id="newPasswordForm" class="form-stack" hidden>
      <div class="field"><label for="newPassword">New password</label><div class="auth-password"><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="text-button" data-password-toggle="newPassword" aria-label="Show new password" aria-pressed="false">Show</button></div></div>
      <div class="field"><label for="confirmPassword">Confirm password</label><div class="auth-password"><input id="confirmPassword" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="text-button" data-password-toggle="confirmPassword" aria-label="Show confirm password" aria-pressed="false">Show</button></div></div>
      <p class="hint">Use at least 8 characters. Choose a longer password you don’t use elsewhere.</p>
      <button class="button" type="submit">Save password</button>
    </form>
    <a class="back-link link" href="./#home">Back to SPACE sign in →</a>
    <noscript><p>Enable JavaScript to securely verify your email and set a password.</p></noscript>
  </main>
  <script src="config.js"></script>
  <script type="module" src="reset-password.js?v=space-account-tabs-20261016"></script>
</body>
</html>
